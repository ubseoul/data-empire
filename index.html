<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0f1c" />
  <title>DATA EMPIRE — Learn SQL by Playing</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-card">
      <div class="eyebrow">DATA EMPIRE</div>
      <h1>Waking up TinyCo…</h1>
      <p>Loading a real SQL database in your browser.</p>
      <div class="loader"><span></span></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="homeBtn" class="brand" type="button" aria-label="Go home">
        <span class="brand-mark">DE</span>
        <span><strong>DATA EMPIRE</strong><small>Learn SQL by playing</small></span>
      </button>
      <div class="simple-stats">
        <span><small>SQL LEVEL</small><strong id="levelLabel">1</strong></span>
        <span><small>XP</small><strong id="xpLabel">0</strong></span>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/sql-wasm.js"></script>
  <script src="app.js"></script>
</body>
</html>
